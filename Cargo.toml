[workspace]
resolver = "2"
members = [
    "app/splitshare",
    "crates/splitshare-core",
    "crates/splitshare-application",
    "crates/splitshare-storage",
    "crates/splitshare-network",
    "crates/splitshare-server",
    "crates/splitshare-platform",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["Komron Mukhamadulloev"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util", "sync"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
rust-embed = { version = "8.12", features = ["debug-embed"] }
mime_guess = "2.0"
tempfile = "3.21"
tower = { version = "0.5", features = ["util"] }

cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
getrandom = "0.4"
rustix = { version = "1.1", features = ["fs"] }

async-stream = "0.3"
if-addrs = "0.15"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
