name: CI
on:
  push:
  pull_request:
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: npm ci --prefix web
      - run: bash scripts/check.sh
      - run: bash scripts/build-release.sh
      - if: runner.os == 'Linux'
        run: python3 scripts/smoke-tray-fallback.py
      - if: runner.os == 'Linux'
        run: python3 scripts/smoke-foundation.py
      - if: runner.os == 'Linux'
        run: python3 scripts/smoke-sessions.py
      - if: runner.os == 'Linux'
        run: python3 scripts/test-upload-memory.py
      - if: runner.os == 'Linux'
        run: cargo build --locked -p splitshare
      - if: runner.os == 'Linux'
        run: npx --prefix web playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:e2e --prefix web
