[package]
name = "splitshare-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Axum HTTP API, SSE, Range responses and embedded WebUI serving."

[dependencies]
axum.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true

splitshare-core = { path = "../splitshare-core" }
splitshare-application = { path = "../splitshare-application" }
splitshare-network = { path = "../splitshare-network" }
async-stream.workspace = true
percent-encoding.workspace = true
serde_json.workspace = true
tracing.workspace = true
futures-util.workspace = true

hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

[dev-dependencies]
splitshare-storage = { path = "../splitshare-storage" }
tempfile.workspace = true
reqwest.workspace = true

tower.workspace = true
