[package]
name = "splitshare-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop system tray and OS-specific host adapters."

[dependencies]
directories.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile.workspace = true
splitshare-core = { path = "../splitshare-core" }
tray-icon = { version = "=0.24.2", default-features = false, features = ["gtk"] }
tao = { version = "0.35.3", default-features = false }
open = { version = "5.4.1", default-features = false }
arboard = { version = "3.6", default-features = false }

tokio.workspace = true
tracing.workspace = true
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
