[package]
name = "splitshare-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sandboxed virtual filesystem and streaming file operations."

[dependencies]
splitshare-core = { path = "../splitshare-core" }
cap-std.workspace = true
cap-fs-ext.workspace = true
getrandom.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO", "Wdk_Storage_FileSystem"] }
